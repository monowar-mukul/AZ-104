<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,sans-serif}

nav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}nav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}

<script>
const Q=[{"id": "AZ-001", "n": 1, "cat": "Compute availability", "diff": "Beginner", "q": "You place two VMs in the same availability set. Which Azure VM uptime SLA does Microsoft document for this configuration?", "opts": ["99.9%", "99.95%", "99.99%", "99.999%"], "h": "f3124c8dd9b88491322c509aeccfd5acfaa48819bd37bd0243b81203a67e4926", "exp": "Two or more VMs in an availability set meet the 99.95% SLA. 99.99% requires two or more VMs across availability zones.", "url": "https://learn.microsoft.com/azure/virtual-machines/availability-set-overview"}, {"id": "AZ-002", "n": 2, "cat": "Compute availability", "diff": "Advanced", "q": "A workload must survive the loss of an entire datacenter and meet a 99.99% VM SLA in one region. What should you deploy?", "opts": ["Two VMs in one availability set", "Two or more VMs spread across at least two availability zones", "One VM with Premium SSD disks", "Two VMs behind Traffic Manager in the same zone"], "h": "34cc54dbbfe7b55a8b9a98d2182e239e5564151ffd07540f60fc6d3e374df249", "exp": "The 99.99% VM SLA needs at least two instances in at least two availability zones of the same region. An availability set is 99.95%, and one zone is a single failure boundary.", "url": "https://learn.microsoft.com/en-us/answers/a/1114898"}, {"id": "AZ-003", "n": 3, "cat": "Compute availability", "diff": "Intermediate", "q": "Your VMs are in an availability set. Which failure is NOT mitigated by the availability set?", "opts": ["A rack losing power", "A top-of-rack network switch failing", "A crash inside the guest OS or application", "Host maintenance affecting one fault domain"], "h": "054796cb6ddfbe3c92aaa1591029932ca9e774c5b33321f09732bbd9bd0acf3e", "exp": "Fault domains share power and a network switch, so the set protects against those. It does not protect against OS or application-specific failures.", "url": "https://learn.microsoft.com/azure/virtual-machines/availability-set-overview"}, {"id": "AZ-005", "n": 4, "cat": "Data transfer", "diff": "Intermediate", "q": "You plan to ship your own disks to import 30 TB using the Azure Import/Export service. Which destinations can an import job target?", "opts": ["Azure Blob storage and Azure Files", "Azure Blob storage only", "Azure Files and Azure Table storage", "Blob storage, Files and Azure Cosmos DB"], "h": "09f63cb0364a69eff775c752c26c250c51258a94d6377eacd451b289246a6aa4", "exp": "Import jobs support Azure Blob storage and Azure Files. Tables, queues and databases are not import destinations.", "url": "https://learn.microsoft.com/azure/import-export/storage-import-export-service"}, {"id": "AZ-006", "n": 5, "cat": "Data transfer", "diff": "Intermediate", "q": "You need to export data to shipped drives with Azure Import/Export. Which data can the service export?", "opts": ["A file share in Azure Files", "Block, page and append blobs in Blob storage", "Rows from an Azure SQL database", "Entities from Azure Table storage"], "h": "063df7df27f99ac3e7d502caf4ac8f1ecc6a9d1caccfb25d869572ce6fef064c", "exp": "Export is supported only for Azure Blob storage. Export of Azure Files is not supported.", "url": "https://learn.microsoft.com/azure/import-export/storage-import-export-service"}, {"id": "AZ-007", "n": 6, "cat": "Storage connectivity", "diff": "Beginner", "q": "Users on a home network get system error 53 when mapping an Azure file share over SMB. What is the most likely cause?", "opts": ["Outbound TCP port 445 is blocked", "Outbound TCP port 3389 is blocked", "Outbound TCP port 80 is blocked", "The storage account is using NTLMv2"], "h": "d8bf231c17f81c51925ed176f9d4fec06b37cd0dac3ed22cd3673d3b8da51fb0", "exp": "SMB needs outbound TCP 445. ISPs and firewalls often block it, which causes errors 53 and 67. Azure Files requires NTLMv2, so enabling it is not a fault.", "url": "https://learn.microsoft.com/en-us/azure/storage/files/files-troubleshoot-smb-connectivity"}, {"id": "AZ-008", "n": 7, "cat": "Storage connectivity", "diff": "Intermediate", "q": "An ISP blocks port 445 and a VPN is not available. How can users still reach the Azure file share contents?", "opts": ["Switch the share to listen on port 80", "Use a REST-based tool such as Azure Storage Explorer over HTTPS (443)", "Open port 445 on the storage account firewall", "Change the share name to include the region"], "h": "72c9f5e66112bd09a88f8db51b649b7c2fee0607af9eda33116e035e52b1d5cd", "exp": "Azure Files also supports REST over HTTPS. Storage Explorer or PowerShell can reach the share when 445 is blocked.", "url": "https://learn.microsoft.com/en-us/azure/storage/files/files-troubleshoot-smb-connectivity"}, {"id": "AZ-010", "n": 8, "cat": "Backup", "diff": "Beginner", "q": "Which Azure resource stores and manages backups for Azure VMs and Azure file shares?", "opts": ["A blob container in a storage account", "A Recovery Services vault", "A Log Analytics workspace", "An Azure Site Recovery recovery plan"], "h": "35462756027ce3b9b938e13a3b21a5bf470c7b70b341df90d265a8955edf679f", "exp": "Azure Backup uses Recovery Services vaults for Azure VMs, SQL in Azure VMs, SAP HANA in Azure VMs and Azure file shares.", "url": "https://learn.microsoft.com/en-us/azure/backup/backup-support-matrix"}, {"id": "AZ-011", "n": 9, "cat": "Backup", "diff": "Advanced", "q": "You must back up VMs located in East US and West Europe with Azure Backup. What is the minimum number of Recovery Services vaults?", "opts": ["One vault in any region", "Two, one in each region", "One per VM", "One per subscription"], "h": "23ad05b1871d21178204cf4340494bd5126d6e67d7c2946aa38a8fa2305a1fe9", "exp": "You need a vault in every Azure region that contains VMs you want to back up, because backups cannot go to a different region.", "url": "https://learn.microsoft.com/en-us/azure/backup/backup-support-matrix"}, {"id": "AZ-012", "n": 10, "cat": "Compute", "diff": "Intermediate", "q": "A single VM running an app that cannot scale out peaks monthly. What should a scheduled runbook do?", "opts": ["Resize the VM to a larger size", "Add the VM to a scale set", "Install a diagnostics extension", "Increase the subscription vCPU quota"], "h": "afa26a1d59aa92a14e1d18e22182b8374070c7528efc059ecee300fb43183f19", "exp": "Resizing raises vCPU and memory for one instance; scale sets need multi-instance support.", "url": ""}, {"id": "AZ-021", "n": 11, "cat": "Compute", "diff": "Beginner", "q": "You must install nginx at first boot on many Linux VMs automatically. What do you supply?", "opts": ["A deploy.xml file", "A cloud-init script as custom data", "An RDP session per VM", "A Network Watcher agent"], "h": "4df91aa4d65b43adecce5bd889fe49c39613b78f3cd4aca0ce5abfe9d6cfa3bf", "exp": "Azure Linux images run cloud-init from custom data at first boot.", "url": "https://learn.microsoft.com/en-us/azure/virtual-machines/linux/tutorial-automate-vm-deployment"}, {"id": "AZ-031", "n": 12, "cat": "Storage", "diff": "Beginner", "q": "What is the UNC path for share data in account contosostore?", "opts": ["\\\\contosostore.blob.core.windows.net\\data", "\\\\data.file.core.windows.net\\contosostore", "\\\\portal.azure.com\\contosostore", "\\\\contosostore.file.core.windows.net\\data"], "h": "85a08c9805e05176834d3424b9dc83f62d3d570d73771f2e31596d2d948f209f", "exp": "Azure Files uses account.file.core.windows.net.", "url": ""}, {"id": "AZ-032", "n": 13, "cat": "Storage", "diff": "Beginner", "q": "Which setting lowers cost for rarely accessed blob data?", "opts": ["Change the access tier to cool or archive", "Change performance to premium", "Change replication to GRS", "Change the account kind"], "h": "13546bbfc1ac3c5def53cafb95f4b2ae5fa8df4b373a0ba8878e65aabbd0e455", "exp": "Access tiers price data by access frequency.", "url": "https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview"}, {"id": "AZ-033", "n": 14, "cat": "Storage", "diff": "Beginner", "q": "How many copies does locally redundant storage keep?", "opts": ["Two in two regions", "Three, within one datacenter", "One", "Six across two regions"], "h": "6eeb8385c680fe92143f6a67c97c1b4c4215bf93ffd192cb5027349210c975fe", "exp": "LRS replicates synchronously three times in a single datacenter.", "url": "https://learn.microsoft.com/en-us/azure/virtual-machines/disks-redundancy"}, {"id": "AZ-034", "n": 15, "cat": "Storage", "diff": "Intermediate", "q": "After creating a sync group, what do you do to sync an on-premises server with Azure Files?", "opts": ["Create a data gateway, then a vault", "Install DFS Replication, then register", "Install the agent, register the server, add a server endpoint", "Create a recovery plan"], "h": "dbaec1d32e5306c29a95afd3d9cc2b6198ee32959c3b1d8b27e5f9ca43603192", "exp": "These are the Azure File Sync onboarding steps.", "url": ""}, {"id": "AZ-035", "n": 16, "cat": "Storage", "diff": "Intermediate", "q": "Two server endpoints hold different files with the same name. What does Azure File Sync do?", "opts": ["Overwrites the older", "Moves one to another folder", "Deletes both", "Keeps both, renaming one with the endpoint name"], "h": "e46d1e70fd39bbfad6e1891add630ef2a8fdb7dc35c8269af921426cf2960e28", "exp": "Azure File Sync keeps both versions: the older file gets the endpoint (server) name and a conflict number appended.", "url": "https://learn.microsoft.com/en-us/azure/storage/files/storage-files-faq"}, {"id": "AZ-036", "n": 17, "cat": "Storage", "diff": "Intermediate", "q": "Which AzCopy command uploads a local folder and its subfolders to a blob container?", "opts": ["azcopy copy with the --recursive flag", "azcopy sync with --snapshot", "az storage blob copy start-batch", "azcopy login"], "h": "fb2334351a28944069f6b7ae16e2d0bc40585a96969ab1aac43276b433cc367b", "exp": "azcopy copy --recursive uploads a directory tree.", "url": "https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-blobs-upload"}, {"id": "AZ-037", "n": 18, "cat": "Storage", "diff": "Intermediate", "q": "Which services can AzCopy copy data to?", "opts": ["Tables and Queues", "Blob and Azure Files", "Tables only", "Queues only"], "h": "438da0ea4cffa22e7cea47dc23bf6760f467f4ca281e2b4f3db010970a9fb2ee", "exp": "AzCopy handles blob and file data, not tables or queues.", "url": "https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-v10"}, {"id": "AZ-038", "n": 19, "cat": "Storage", "diff": "Advanced", "q": "A SAS restricts the allowed IP range and a client connects from outside it. What results?", "opts": ["Read-only access", "Full access", "Access is denied", "A credential prompt grants access"], "h": "f9b537d4647bd68bb39c22df3c0ca532828416da9d8313e42280328739d24f23", "exp": "The service rejects requests from IPs outside the SAS range.", "url": ""}, {"id": "AZ-039", "n": 20, "cat": "Data transfer", "diff": "Intermediate", "q": "You must move 34 TB with Microsoft-supplied hardware and no WAN impact. What do you order?", "opts": ["Azure File Sync", "AzCopy over VPN", "Azure Backup", "Azure Data Box"], "h": "aabf58f621ac486d2ba3d25f23700e2c7ed1df44b11bb12091a71867545e8b91", "exp": "Data Box is a shipped appliance for offline transfer.", "url": "https://learn.microsoft.com/en-us/azure/databox/data-box-faq"}],S={};let i=0;const $=s=>document.querySelector(s);
const H=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,"0")).join("");
const done=()=>Q.filter(q=>S[q.id]&&S[q.id].ok!==undefined),score=()=>Q.filter(q=>S[q.id]&&S[q.id].ok).length;
function hdr(){const d=done().length;$("#pb").style.width=d/Q.length*100+"%";$("#sc").textContent=`Score ${score()}/${d} answered · ${d?Math.round(score()/d*100):0}%`;
$("#nv").innerHTML=Q.map((q,k)=>{const s=S[q.id]||{};return`<button class="${k===i?"cur ":""}${s.ok===true?"ok":s.ok===false?"no":""}" onclick="go(${k})" aria-label="Question ${k+1}">${k+1}</button>`}).join("")}
function go(k){i=k;draw()}
function draw(){hdr();if(i>=Q.length)return results();const q=Q[i],s=S[q.id]||(S[q.id]={}),fin=s.ok!==undefined;
$("#app").innerHTML=`<div class="meta">Question ${i+1} of ${Q.length} · ${q.cat} · ${q.diff}</div><h2 style="font-size:1.1rem;margin:0 0 10px">${q.q}</h2>`+
q.opts.map((o,k)=>{const L="ABCD"[k];let c="opt";if(fin){if(L===s.right)c+=" ok";else if(L===s.sel)c+=" no"}else if(L===s.sel)c+=" sel";return`<button class="${c}" ${fin?"disabled":""} onclick="pick('${L}')"><b>${L}</b><span>${o}</span></button>`}).join("")+
(fin?`<div class="fb ${s.ok?"ok":"no"}"><strong>${s.ok?"✓ Correct":"✗ Incorrect — correct answer: "+s.right}</strong><p>${q.exp}</p>${q.url?`<p><a href="${q.url}" target="_blank" rel="noopener">Microsoft Learn reference</a></p>`:`<p><small>⚠ Not yet verified against Microsoft Learn</small></p>`}</div>`:"")+
`<div class="row"><button class="btn g" onclick="go(${i-1})" ${i?"":"disabled"}>Previous</button>${fin?`<button class="btn" onclick="go(${i+1})">${i===Q.length-1?"Finish":"Next"}</button>`:`<button class="btn" onclick="submit()" ${s.sel?"":"disabled"}>Submit answer</button>`}</div>`}
function pick(L){const s=S[Q[i].id];if(s.ok!==undefined)return;s.sel=L;draw()}
async function submit(){const q=Q[i],s=S[q.id];if(s.ok!==undefined||!s.sel||s.busy)return;s.busy=1;
for(const L of"ABCD")if(await H(q.id+":"+L)===q.h)s.right=L;s.ok=s.sel===s.right;s.busy=0;draw()}
function results(){const n=Q.length,c=score(),u=n-done().length;$("#app").innerHTML=`<h2>Final results</h2><div class="big">${Math.round(c/n*100)}%</div><p>${c} correct · ${n-c-u} incorrect${u?` · ${u} unanswered`:""}</p>`+
Q.map(q=>{const s=S[q.id]||{};return`<div class="rv"><b>${q.n}. ${q.q}</b><br>${s.ok===undefined?"Unanswered":s.ok?"✓ Correct ("+s.right+")":"✗ You chose "+s.sel+", correct is "+s.right}<br><small>${q.exp}</small></div>`}).join("")+
`<div class="row"><button class="btn g" onclick="go(0)">Review questions</button><button class="btn" onclick="restart()">Restart exam</button></div>`}
function restart(){for(const k in S)delete S[k];i=0;draw()}
draw();
</script></body></html>
