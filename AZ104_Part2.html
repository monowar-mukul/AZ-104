<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AZ-104 Practice Exam – Part 2: Networking & App Service</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--tx:#1b2430;--mu:#5b6675;--ac:#0078d4;--bd:#d6dde8;--ok:#0f7b3f;--okb:#e3f6ea;--no:#b42318;--nob:#fdeceb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161f;--card:#18212d;--tx:#e8edf3;--mu:#a2adbb;--ac:#4aa8ff;--bd:#2d3948;--ok:#5fd493;--okb:#12301f;--no:#ff8f85;--nob:#3a1815}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
header{background:var(--ac);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{font-size:1.1rem;margin:0}main{max-width:760px;margin:0 auto;padding:18px 14px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}nav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
nav .cur{outline:2px solid var(--ac)}nav .ok{background:var(--ok);color:#fff}nav .no{background:var(--no);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.meta{color:var(--mu);font-size:.85rem;margin-bottom:8px}.opt{display:flex;gap:10px;width:100%;text-align:left;margin:8px 0;padding:12px;border:1.5px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--ac)}.opt.sel{border-color:var(--ac);background:rgba(0,120,212,.1)}.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.no{border-color:var(--no);background:var(--nob)}
.opt b{min-width:22px}.fb{margin-top:14px;padding:12px;border-radius:10px}.fb.ok{background:var(--okb);color:var(--ok)}.fb.no{background:var(--nob);color:var(--no)}.fb p{color:var(--tx);margin:6px 0 0}
.row{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.btn{padding:10px 20px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}.btn.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}.btn:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--ac)}.big{font-size:2.4rem;font-weight:700;color:var(--ac)}.rv{border-top:1px solid var(--bd);padding:12px 0}
</style></head><body>
<header><h1>AZ-104 Practice Exam – Part 2: Networking & App Service</h1><div id="sc" aria-live="polite"></div></header>
<main><div class="bar" role="progressbar"><i id="pb"></i></div><nav id="nv" aria-label="Question navigation"></nav><section id="app" class="card"></section></main>
<script>
const Q=[{"id": "AZ-004", "n": 1, "cat": "Load balancing", "diff": "Advanced", "q": "A colleague proposes a Basic SKU Azure Load Balancer for a new production deployment to save cost. What is the correct response?", "opts": ["Basic is fine because it has a 99.99% SLA", "Use Standard: Basic was retired on 30 September 2025 and has no SLA", "Basic is only retired for internal load balancers", "Use Basic but add zone redundancy"], "h": "2029983035941d4fbdedcf902693792faf45149337863f4c862155ec0e3daac3", "exp": "Microsoft retired Basic Load Balancer on 30 September 2025. It was free with no SLA, whereas Standard carries a 99.99% SLA.", "url": "https://learn.microsoft.com/azure/load-balancer/skus"}, {"id": "AZ-015", "n": 2, "cat": "Networking", "diff": "Intermediate", "q": "You must capture and inspect packets between two VMs for three hours. Which feature fits?", "opts": ["A Network In/Out metric chart", "Azure Advisor", "Traffic Manager", "Network Watcher packet capture"], "h": "a71458fdda3eb84c13eafcdac7c620439294a23d213528925ba514f20187b090", "exp": "Metrics show volume only; packet capture records packets.", "url": "https://learn.microsoft.com/en-us/azure/network-watcher/packet-capture-overview"}, {"id": "AZ-016", "n": 3, "cat": "Networking", "diff": "Intermediate", "q": "Which Network Watcher tool identifies the NSG rule that blocks a packet to a VM?", "opts": ["IP flow verify", "Next hop", "VPN diagnostics", "Connection monitor"], "h": "b4229c51013f180b5d7d7974433926073652a6065ec7553a6e3d1c0723f4bc1e", "exp": "IP flow verify returns the allowing or denying rule.", "url": "https://learn.microsoft.com/en-us/azure/network-watcher/ip-flow-verify-overview"}, {"id": "AZ-017", "n": 4, "cat": "Networking", "diff": "Intermediate", "q": "You need latency trends between VMs in two virtual networks over time. What do you use?", "opts": ["IP flow verify", "Connection monitor", "Next hop", "Effective security rules"], "h": "7023d3ca78dfef3ae19cbbbb60ff5b950f242f9a941580e51d10fd40530242b0", "exp": "Connection monitor measures reachability and round-trip time continuously.", "url": "https://learn.microsoft.com/en-us/azure/network-watcher/frequently-asked-questions"}, {"id": "AZ-019", "n": 5, "cat": "App Service", "diff": "Beginner", "q": "What is required before binding a custom domain to an App Service web app?", "opts": ["Upload a TLS certificate", "Stop the web app", "Add a connection string", "Create the DNS record that proves domain ownership"], "h": "c7cfc103fdd7658661cf033c92884da94cd29cc318b08420e993b9d6efb76303", "exp": "Domain validation via DNS comes first; certificates are for HTTPS afterward.", "url": "https://learn.microsoft.com/en-us/azure/app-service/app-service-web-tutorial-custom-domain"}, {"id": "AZ-020", "n": 6, "cat": "App Service", "diff": "Intermediate", "q": "Ten web apps must be deployed at the lowest cost. What should you deploy first?", "opts": ["One App Service plan shared by the apps", "Ten App Service plans", "Five application gateways", "One Traffic Manager profile"], "h": "1023d474f821a1fa965441bfe016614a43bfb7c3ddef10f48715070301a9a306", "exp": "Apps can share a plan, which defines the compute you pay for.", "url": "https://learn.microsoft.com/en-us/azure/app-service/overview-hosting-plans"}, {"id": "AZ-022", "n": 7, "cat": "Networking", "diff": "Intermediate", "q": "A VPN gateway is policy-based and you need point-to-site access. What should you do?", "opts": ["Add a service endpoint", "Reset the gateway", "Deploy a route-based VPN gateway", "Add address space to the VNet"], "h": "c72a33638cdb56286c71242441ec1bf99fefd6fcac0729cbc863abf4787475d7", "exp": "Point-to-site requires a route-based gateway; type cannot be converted.", "url": "https://learn.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-vpn-gateway-settings"}, {"id": "AZ-023", "n": 8, "cat": "Networking", "diff": "Intermediate", "q": "How do you delegate research.contoso.com to different name servers in Azure DNS?", "opts": ["Create a PTR record", "Edit the SOA record", "Create an A record", "Create an NS record named research in the parent zone"], "h": "808be619cbeff56cba3cdda337e22544e7b61ecb6e6d079b9a5a04f37abf1ffb", "exp": "Delegation uses NS records in the parent zone.", "url": "https://learn.microsoft.com/en-us/azure/dns/delegate-subdomain"}, {"id": "AZ-024", "n": 9, "cat": "Networking", "diff": "Intermediate", "q": "How do you force subnet traffic through a firewall VM?", "opts": ["A user-defined route with next hop virtual appliance", "A network security group", "A service endpoint", "A system route"], "h": "ac6db299219e5299a8275b0f496aa2164f15c5c7e02e2d8c9a39d35504f54e1d", "exp": "UDRs override default routing; NSGs only filter.", "url": "https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview"}, {"id": "AZ-025", "n": 10, "cat": "Networking", "diff": "Intermediate", "q": "Five VMs each need a public and a private IP and identical rules. What is the minimum NIC and NSG count?", "opts": ["10 NICs and 5 NSGs", "5 NICs and 1 NSG", "5 NICs and 5 NSGs", "10 NICs and 1 NSG"], "h": "236ba0f8c91f6e2a130f01f8828868ea4f3c99ff1fdc96162e1d65eadaba2177", "exp": "One NIC holds several IPs; one NSG can be associated with many NICs or a subnet.", "url": ""}, {"id": "AZ-026", "n": 11, "cat": "Networking", "diff": "Intermediate", "q": "A public load balancer handles ports 80 and 443. How do you send RDP to VM3 only?", "opts": ["A new load balancing rule on port 3389 for all VMs", "A second public load balancer", "An inbound NAT rule", "A health probe"], "h": "51df341479062b7509649a410f7653771734db79d8d7626121b8a4571b5f7f1c", "exp": "Inbound NAT maps a frontend port to one backend VM.", "url": "https://learn.microsoft.com/en-us/azure/load-balancer/inbound-nat-rules"}, {"id": "AZ-027", "n": 12, "cat": "Networking", "diff": "Beginner", "q": "Where do you configure the check that tests backend health on port 8090?", "opts": ["The backend pool", "An inbound NAT rule", "The frontend IP configuration", "A health probe"], "h": "9a5dc182d81cf67fbebb61cb8e2ff8173880424ad66a5f4208d8b54897c434fc", "exp": "Health probes define protocol, port and interval.", "url": "https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-custom-probe-overview"}, {"id": "AZ-028", "n": 13, "cat": "App Service", "diff": "Intermediate", "q": "A web app must reach a MySQL VM over its private IP in a VNet. What do you configure?", "opts": ["VNet integration for the web app", "An internal load balancer", "Traffic Manager", "An application gateway"], "h": "d3d9a3fa4e752b4e23380a5cd403c4cdd6749a1936cf51357b275618b03809f9", "exp": "Regional VNet integration lets the app send outbound traffic into the VNet.", "url": "https://learn.microsoft.com/en-us/azure/app-service/overview-vnet-integration"}, {"id": "AZ-029", "n": 14, "cat": "Networking", "diff": "Advanced", "q": "You try to peer two virtual networks with overlapping address spaces. What happens?", "opts": ["Peering works with automatic NAT", "Peering cannot be created", "Peering works in one direction only", "Peering works but routes are ambiguous"], "h": "efdec1867804a9769a65de1d4953638d84b17422188d96dc656d56e95687a1c3", "exp": "Peered VNets must have non-overlapping address spaces.", "url": "https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq"}, {"id": "AZ-030", "n": 15, "cat": "Networking", "diff": "Intermediate", "q": "A VNet peering shows Disconnected after the remote side was deleted. What is the effect?", "opts": ["Traffic flows one way", "Traffic uses the internet", "No traffic flows until the peering is recreated on both sides", "Traffic flows normally"], "h": "b2bc69cccd144f34ec6b7b78b4db20cd28627f5cacc7b98e1d002398b7584529", "exp": "Disconnected means one peering link was deleted; both links must be recreated before traffic flows.", "url": "https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq"}, {"id": "AZ-042", "n": 16, "cat": "App Service", "diff": "Intermediate", "q": "A slot swap caused performance issues. What is the quickest rollback?", "opts": ["Restore a backup", "Clone the app", "Swap the slots again", "Redeploy from source"], "h": "15380e46206137f391468cce301bf00c2d17ecd0a039bb892a3054b7005a5867", "exp": "Swapping back restores the previous code immediately.", "url": ""}, {"id": "AZ-050", "n": 17, "cat": "Networking", "diff": "Advanced", "q": "Active-active NVAs must receive traffic on all ports. What do you deploy?", "opts": ["A Basic load balancer", "Traffic Manager", "A Standard internal load balancer with an HA ports rule", "An application gateway"], "h": "560e330a95f6ed3afafb39c4624b42f19af3876b5b27eed69171ef07a4bbe6de", "exp": "HA ports balance all ports on Standard internal LBs.", "url": "https://learn.microsoft.com/en-us/azure/load-balancer/components"}, {"id": "AZ-058", "n": 18, "cat": "Networking", "diff": "Intermediate", "q": "Which feature gives a storage account a private IP inside your VNet?", "opts": ["Service endpoint", "Network peering", "Private endpoint", "Route table"], "h": "93689707874c4eda20c495b3ee19b3accaf97d8e33a53413112d8482ba48a946", "exp": "Private endpoints add a private IP for the service.", "url": "https://learn.microsoft.com/en-us/azure/virtual-network/vnet-integration-for-azure-services"}, {"id": "AZ-059", "n": 19, "cat": "Networking", "diff": "Intermediate", "q": "Rule 100 allows TCP 443 and rule 200 denies TCP 443. What happens to 443 traffic?", "opts": ["It is denied", "It is logged only", "It alternates", "It is allowed"], "h": "86828b25d168c437920ce4ce558bfe6e377ca7626a41251328b1b0c78fab9344", "exp": "Lower priority numbers are processed first.", "url": "https://learn.microsoft.com/en-US/Azure/virtual-network/network-security-groups-overview"}, {"id": "AZ-060", "n": 20, "cat": "Networking", "diff": "Intermediate", "q": "VNet A is peered with B and B with C. Can A reach C?", "opts": ["No, peering is not transitive", "Yes automatically", "Only for ICMP", "Only for TCP"], "h": "fcb9f1a4801750f1ac80554888c1f4ddcf1a7c33277354fdd54fc727ccd3fd3c", "exp": "Peering is non-transitive without a gateway or NVA.", "url": "https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-faq"}],S={};let i=0;const $=s=>document.querySelector(s);
const H=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,"0")).join("");
const done=()=>Q.filter(q=>S[q.id]&&S[q.id].ok!==undefined),score=()=>Q.filter(q=>S[q.id]&&S[q.id].ok).length;
function hdr(){const d=done().length;$("#pb").style.width=d/Q.length*100+"%";$("#sc").textContent=`Score ${score()}/${d} answered · ${d?Math.round(score()/d*100):0}%`;
$("#nv").innerHTML=Q.map((q,k)=>{const s=S[q.id]||{};return`<button class="${k===i?"cur ":""}${s.ok===true?"ok":s.ok===false?"no":""}" onclick="go(${k})" aria-label="Question ${k+1}">${k+1}</button>`}).join("")}
function go(k){i=k;draw()}
function draw(){hdr();if(i>=Q.length)return results();const q=Q[i],s=S[q.id]||(S[q.id]={}),fin=s.ok!==undefined;
$("#app").innerHTML=`<div class="meta">Question ${i+1} of ${Q.length} · ${q.cat} · ${q.diff}</div><h2 style="font-size:1.1rem;margin:0 0 10px">${q.q}</h2>`+
q.opts.map((o,k)=>{const L="ABCD"[k];let c="opt";if(fin){if(L===s.right)c+=" ok";else if(L===s.sel)c+=" no"}else if(L===s.sel)c+=" sel";return`<button class="${c}" ${fin?"disabled":""} onclick="pick('${L}')"><b>${L}</b><span>${o}</span></button>`}).join("")+
(fin?`<div class="fb ${s.ok?"ok":"no"}"><strong>${s.ok?"✓ Correct":"✗ Incorrect — correct answer: "+s.right}</strong><p>${q.exp}</p>${q.url?`<p><a href="${q.url}" target="_blank" rel="noopener">Microsoft Learn reference</a></p>`:`<p><small>⚠ Not yet verified against Microsoft Learn</small></p>`}</div>`:"")+
`<div class="row"><button class="btn g" onclick="go(${i-1})" ${i?"":"disabled"}>Previous</button>${fin?`<button class="btn" onclick="go(${i+1})">${i===Q.length-1?"Finish":"Next"}</button>`:`<button class="btn" onclick="submit()" ${s.sel?"":"disabled"}>Submit answer</button>`}</div>`}
function pick(L){const s=S[Q[i].id];if(s.ok!==undefined)return;s.sel=L;draw()}
async function submit(){const q=Q[i],s=S[q.id];if(s.ok!==undefined||!s.sel||s.busy)return;s.busy=1;
for(const L of"ABCD")if(await H(q.id+":"+L)===q.h)s.right=L;s.ok=s.sel===s.right;s.busy=0;draw()}
function results(){const n=Q.length,c=score(),u=n-done().length;$("#app").innerHTML=`<h2>Final results</h2><div class="big">${Math.round(c/n*100)}%</div><p>${c} correct · ${n-c-u} incorrect${u?` · ${u} unanswered`:""}</p>`+
Q.map(q=>{const s=S[q.id]||{};return`<div class="rv"><b>${q.n}. ${q.q}</b><br>${s.ok===undefined?"Unanswered":s.ok?"✓ Correct ("+s.right+")":"✗ You chose "+s.sel+", correct is "+s.right}<br><small>${q.exp}</small></div>`}).join("")+
`<div class="row"><button class="btn g" onclick="go(0)">Review questions</button><button class="btn" onclick="restart()">Restart exam</button></div>`}
function restart(){for(const k in S)delete S[k];i=0;draw()}
draw();
</script></body></html>
