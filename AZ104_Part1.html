<style>

const Q=[{"id": "AZ-009", "n": 1, "cat": "Monitoring", "diff": "Intermediate", "q": "You must alert when error events appear in a Windows VM system log. Which current approach collects those events?", "opts": ["Install the Microsoft Monitoring Agent (Log Analytics agent)", "Install Azure Monitor Agent with a data collection rule to a Log Analytics workspace", "Create a storage account with a SAS and use it as the alert source", "Create an Event Grid subscription on the VM"], "h": "c5299235c5eed4d9cf0f7c86253c29de0dd6f29a7df154e5be7289ac5294003e", "exp": "The Log Analytics (MMA) agent was retired on 31 August 2024. Azure Monitor Agent with a data collection rule sends events to a workspace, where a log alert can query them.", "url": "https://learn.microsoft.com/en-au/azure/azure-monitor/agents/azure-monitor-agent-migration"}, {"id": "AZ-013", "n": 2, "cat": "Governance", "diff": "Intermediate", "q": "You need every new NSG in a subscription to block TCP 8080. What should you use?", "opts": ["A resource lock on the subscription", "An Azure Policy definition assigned to the subscription", "A budget alert", "A resource tag"], "h": "e9a221039e38992a9ca74edefad4ad482fb662bffa5e4b2bb40df5ac9e6798c8", "exp": "Policy enforces configuration; locks only prevent changes or deletion.", "url": "https://learn.microsoft.com/en-us/azure/governance/policy/overview"}, {"id": "AZ-014", "n": 3, "cat": "Governance", "diff": "Beginner", "q": "You must allow only certain VM sizes to be deployed. Which service enforces this?", "opts": ["Resource locks", "Azure Advisor", "Azure Policy", "Network Watcher"], "h": "748c31ef1ca1e3a00dbfe1b6c325dd39ea8cbd0f2301a740f65f767030535349", "exp": "The Allowed virtual machine size SKUs policy restricts sizes.", "url": "https://learn.microsoft.com/en-us/azure/governance/policy/samples/built-in-policies"}, {"id": "AZ-018", "n": 4, "cat": "Security", "diff": "Beginner", "q": "How should an ARM template reference an administrator password without storing it in plain text?", "opts": ["A storage account blob", "A Recovery Services vault", "A Key Vault secret reference", "A resource tag"], "h": "c74128fde35fc4eda6b7fa20fd96736b7b0685864d954de2290697a2c3f40be9", "exp": "Key Vault stores secrets; templates reference them securely.", "url": "https://learn.microsoft.com/en-us/azure/azure-resource-manager/templates/key-vault-parameter"}, {"id": "AZ-040", "n": 5, "cat": "Governance", "diff": "Intermediate", "q": "Where do you see when template-deployed resources in a resource group were created?", "opts": ["Resource group Deployments", "Subscription Resource providers", "Automation script", "Programmatic deployment"], "h": "29332da59c3b974e474dc5eb37c8cd43d4feb29c92479c36dcaa68505dfc6052", "exp": "Deployments lists each deployment with timestamps.", "url": ""}, {"id": "AZ-041", "n": 6, "cat": "Governance", "diff": "Intermediate", "q": "Can you redeploy the ARM template that created a VM to restore its configuration?", "opts": ["No, templates work only once", "Yes, templates are declarative and repeatable", "Only with PowerShell", "Only from the Marketplace"], "h": "0b2cf8fbd9960d5c72c576f735227e26a95c698897442ba5b87ab69447977f4f", "exp": "Redeploying applies the declared state.", "url": ""}, {"id": "AZ-043", "n": 7, "cat": "Backup", "diff": "Beginner", "q": "Where are backup schedule and retention defined for Azure VM backup?", "opts": ["In a batch job", "In a recovery plan", "In a cron job", "In a backup policy"], "h": "3e12c7415d8ac6ad9659498af84d8ea8621617bca960c86ad9a7d22cef928e13", "exp": "The backup policy holds schedule and retention.", "url": ""}, {"id": "AZ-044", "n": 8, "cat": "Identity", "diff": "Intermediate", "q": "Which resource provider namespace lets a custom role open support requests?", "opts": ["Microsoft.Support", "Microsoft.Compute", "Microsoft.Storage", "Microsoft.Network"], "h": "906cc06292b37532877d3b3536dfe014857fe6cf76b7056ee86d62aa9ef3ae41", "exp": "Support request actions live under Microsoft.Support.", "url": "https://learn.microsoft.com/en-us/azure/role-based-access-control/tutorial-custom-role-cli"}, {"id": "AZ-045", "n": 9, "cat": "Governance", "diff": "Intermediate", "q": "A not-allowed-resource-types policy blocks SQL servers at subscription scope, excluding RG01. Where can SQL servers be created?", "opts": ["Anywhere", "Only in RG01", "Nowhere", "Everywhere except RG01"], "h": "d44814fd97cb76cf44d3b062b96f047d4c1ed126ce124f02b9c9c6465a963902", "exp": "Excluded scopes are not evaluated.", "url": "https://learn.microsoft.com/en-us/azure/governance/policy/concepts/scope"}, {"id": "AZ-046", "n": 10, "cat": "Monitoring", "diff": "Intermediate", "q": "You have four alert conditions and three recipient sets. Minimum alert rules and action groups?", "opts": ["3 rules and 4 groups", "1 rule and 1 group", "4 alert rules and 3 action groups", "4 rules and 4 groups"], "h": "ebf9ef01e42db5a61f7f012c37c0b1658b8f5a5e7c811f03f650d31e48b16890", "exp": "One rule per condition; one action group per distinct recipient set.", "url": "https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/action-groups"}, {"id": "AZ-047", "n": 11, "cat": "Compute", "diff": "Beginner", "q": "Which concept prevents all VMs in an availability set rebooting together during planned maintenance?", "opts": ["Fault domains", "Proximity placement groups", "Availability zones", "Update domains"], "h": "6893bb8418d339485fb33b3fc7c78dcfe31fc7436f3d3bbac8302190989a9ba8", "exp": "Update domains are rebooted one at a time.", "url": "https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview"}, {"id": "AZ-048", "n": 12, "cat": "Compute", "diff": "Intermediate", "q": "Every VM in a scale set needs nginx installed after deployment. What do you use?", "opts": ["Custom Script Extension", "Application Insights", "Network Watcher", "Azure Advisor"], "h": "9fe7366af674feb23fc74aa0b0c18ad55bc311f1c550c1012f6615a50b5e21ab", "exp": "The extension runs a script on each instance.", "url": ""}, {"id": "AZ-049", "n": 13, "cat": "Compute", "diff": "Advanced", "q": "Three VMs must keep two running if one zone fails. What design works?", "opts": ["Put all in one zone", "Spread them across three availability zones", "Use one availability set", "Use separate resource groups"], "h": "5e6d956c723204ddaae2659be477463968c0062f43287dfa4fe670c8569198d7", "exp": "Zones are separate failure domains.", "url": ""}, {"id": "AZ-051", "n": 14, "cat": "Security", "diff": "Intermediate", "q": "What must be true of the Key Vault used for Azure Disk Encryption?", "opts": ["Different region than the VM", "Soft delete disabled", "Locked read-only", "Same region and subscription as the VM"], "h": "81378b1dc719cebe4620fadf19d790ab658a3bdad8e413aec635ebf0f3987f13", "exp": "ADE requires co-located vault and VM.", "url": "https://learn.microsoft.com/en-us/azure/virtual-machines/windows/disk-encryption-overview"}, {"id": "AZ-052", "n": 15, "cat": "Monitoring", "diff": "Intermediate", "q": "Which alert type fires when a log query returns more than two error events in an hour?", "opts": ["Log search alert", "Activity log alert", "Metric alert", "Service health alert"], "h": "3ffb5792d6dc66d7543b7f5405ef16c8264726829b60f5998f2e18a65ba312be", "exp": "Log search alerts run KQL on a schedule.", "url": "https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-types"}, {"id": "AZ-053", "n": 16, "cat": "Identity", "diff": "Beginner", "q": "Which built-in role gives least-privilege read access to all subscription resources?", "opts": ["Contributor", "Reader", "Owner", "User Access Administrator"], "h": "8f9e9740863fe961bdf77db5ed5dfe3d0c0972880b39dd043ea2d91648116172", "exp": "Reader views but cannot change.", "url": "https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/general"}, {"id": "AZ-054", "n": 17, "cat": "Identity", "diff": "Intermediate", "q": "A role is assigned at subscription scope. Where does it apply?", "opts": ["Only the subscription object", "Only new resources", "All resource groups and resources beneath it", "Only that region"], "h": "ddaca134589927f2316adcfb824b8d7dff020aa8c2eb9bf1a36bbfea71c35175", "exp": "RBAC assignments inherit downward.", "url": "https://learn.microsoft.com/en-us/azure/role-based-access-control/role-assignments-steps"}, {"id": "AZ-055", "n": 18, "cat": "Governance", "diff": "Beginner", "q": "How do you prevent accidental deletion of a production storage account?", "opts": ["Apply a tag", "Apply a budget", "Apply a policy exclusion", "Apply a CanNotDelete lock"], "h": "2e70edcb97f8f9eb73168e42e1832f92337f39c774546a247f435d1137198570", "exp": "Locks block deletion even for owners.", "url": "https://learn.microsoft.com/en-us/azure/storage/common/lock-account-resource"}, {"id": "AZ-056", "n": 19, "cat": "Governance", "diff": "Intermediate", "q": "Are tags on a resource group automatically inherited by its resources?", "opts": ["No; use Azure Policy to apply or inherit them", "Yes, always", "Yes, only for VMs", "Only in production"], "h": "1080e36cbe7d9a31042a2dde9b7a75c20677c3730c72a0a7e6c26f9c0d09b796", "exp": "Tag inheritance needs a policy.", "url": "https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources"}, {"id": "AZ-057", "n": 20, "cat": "Resilience", "diff": "Intermediate", "q": "You need to replicate VMs to another region for failover. Which service?", "opts": ["Azure Backup only", "Azure Site Recovery", "Availability sets", "Azure Monitor"], "h": "50b2cdd1ffe5f825ee9f2bb1f6e72243b46a115fb49855a46befe8f60e4dca14", "exp": "Site Recovery replicates and orchestrates failover.", "url": ""}],S={};let i=0;const $=s=>document.querySelector(s);
const H=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,"0")).join("");
const done=()=>Q.filter(q=>S[q.id]&&S[q.id].ok!==undefined),score=()=>Q.filter(q=>S[q.id]&&S[q.id].ok).length;
function hdr(){const d=done().length;$("#pb").style.width=d/Q.length*100+"%";$("#sc").textContent=`Score ${score()}/${d} answered · ${d?Math.round(score()/d*100):0}%`;
$("#nv").innerHTML=Q.map((q,k)=>{const s=S[q.id]||{};return`<button class="${k===i?"cur ":""}${s.ok===true?"ok":s.ok===false?"no":""}" onclick="go(${k})" aria-label="Question ${k+1}">${k+1}</button>`}).join("")}
function go(k){i=k;draw()}
function draw(){hdr();if(i>=Q.length)return results();const q=Q[i],s=S[q.id]||(S[q.id]={}),fin=s.ok!==undefined;
$("#app").innerHTML=`<div class="meta">Question ${i+1} of ${Q.length} · ${q.cat} · ${q.diff}</div><h2 style="font-size:1.1rem;margin:0 0 10px">${q.q}</h2>`+
q.opts.map((o,k)=>{const L="ABCD"[k];let c="opt";if(fin){if(L===s.right)c+=" ok";else if(L===s.sel)c+=" no"}else if(L===s.sel)c+=" sel";return`<button class="${c}" ${fin?"disabled":""} onclick="pick('${L}')"><b>${L}</b><span>${o}</span></button>`}).join("")+
(fin?`<div class="fb ${s.ok?"ok":"no"}"><strong>${s.ok?"✓ Correct":"✗ Incorrect — correct answer: "+s.right}</strong><p>${q.exp}</p>${q.url?`<p><a href="${q.url}" target="_blank" rel="noopener">Microsoft Learn reference</a></p>`:`<p><small>⚠ Not yet verified against Microsoft Learn</small></p>`}</div>`:"")+
`<div class="row"><button class="btn g" onclick="go(${i-1})" ${i?"":"disabled"}>Previous</button>${fin?`<button class="btn" onclick="go(${i+1})">${i===Q.length-1?"Finish":"Next"}</button>`:`<button class="btn" onclick="submit()" ${s.sel?"":"disabled"}>Submit answer</button>`}</div>`}
function pick(L){const s=S[Q[i].id];if(s.ok!==undefined)return;s.sel=L;draw()}
async function submit(){const q=Q[i],s=S[q.id];if(s.ok!==undefined||!s.sel||s.busy)return;s.busy=1;
for(const L of"ABCD")if(await H(q.id+":"+L)===q.h)s.right=L;s.ok=s.sel===s.right;s.busy=0;draw()}
function results(){const n=Q.length,c=score(),u=n-done().length;$("#app").innerHTML=`<h2>Final results</h2><div class="big">${Math.round(c/n*100)}%</div><p>${c} correct · ${n-c-u} incorrect${u?` · ${u} unanswered`:""}</p>`+
Q.map(q=>{const s=S[q.id]||{};return`<div class="rv"><b>${q.n}. ${q.q}</b><br>${s.ok===undefined?"Unanswered":s.ok?"✓ Correct ("+s.right+")":"✗ You chose "+s.sel+", correct is "+s.right}<br><small>${q.exp}</small></div>`}).join("")+
`<div class="row"><button class="btn g" onclick="go(0)">Review questions</button><button class="btn" onclick="restart()">Restart exam</button></div>`}
function restart(){for(const k in S)delete S[k];i=0;draw()}
draw();
</script></body></html>
